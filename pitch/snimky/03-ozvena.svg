  <text x="24" y="328" fill="#F3EFE9" font-size="21" font-weight="700">Čemu se teď vyhýbáš?</text>
  <text x="24" y="350" fill="#C1B7AA" font-size="13">Pojmenovat pocit často stačí, aby tlak povolil.</text>
  <rect x="24" y="366" width="70" height="32" rx="10" fill="#1C1A17" stroke="#474139"/>
  <text x="59" y="387" text-anchor="middle" fill="#F3EFE9" font-size="12">Nuda</text>
